          const txt = s.from===ME ? `Pagas a <b>${esc(nm(s.to))}</b>` : s.to===ME ? `<b>${esc(nm(s.from))}</b> te paga` : `<b>${esc(nm(s.from))}</b> paga a <b>${esc(nm(s.to))}</b>`;
          const acts = s.to===ME
            ? `<button type="button" class="btn small" data-settle="${esc(s.from)}|${esc(s.to)}|${s.amount}">Ya me pagó</button><button type="button" class="btn small soft" data-tomedeben="${esc(s.from)}|${s.amount}">Pasar a Me deben</button>`
            : `<button type="button" class="btn small ghost" data-settle="${esc(s.from)}|${esc(s.to)}|${s.amount}">Marcar pagado</button>`;
          return `<div class="settle"><div class="tr">${mav(s.from,"sm")}<span class="arr" aria-hidden="true">${ARROW}</span>${mav(s.to,"sm")}<span class="txt">${txt}</span><span class="v">${money(s.amount)}</span></div><div class="acts" style="padding-left:0">${acts}</div></div>`;
        }).join("") : `<p class="hint" style="padding:4px 0">${exps.length ? "Todo cuadra. Nadie debe nada." : "Añade el primer gasto y aquí verás quién tiene que pagar a quién."}</p>`}
      </div>`;

    const addPerson = `<div class="addperson"><input id="gpNew" autocomplete="off" placeholder="Añadir persona al grupo" aria-label="Nombre"><button type="button" class="btn ghost" data-act="gpadd">Añadir</button></div>`;
    const resumenHtml = `<div class="pane">${whoPaid}${accounts}${transfers}${addPerson}</div>`;

    // Gastos, cada uno con su desglose
    const gastosHtml = items.length ? `<div class="card" style="padding-block:4px">${items.map(e=>{
      if (e.type==="settle") return `<div class="settle-row-x"><span class="mv in" aria-hidden="true">✓</span><div style="flex:1;min-width:0"><div class="t1" style="font-weight:500">${esc(nm(e.from))} ${e.from===ME?"pagaste":"pagó"} a ${esc(e.to===ME?"ti":nm(e.to))}</div><div class="hint" style="font-size:12px">${fmtShort(e.date)}${e.note?" · "+esc(e.note):""}</div></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-weight:600;color:var(--ok);font-variant-numeric:tabular-nums">${money(e.amount)}</span><button type="button" class="rm" data-rmexp="${esc(e.id)}">Deshacer</button></div></div>`;
      const among = (e.among||[]).filter(x=>g.members.some(m=>m.id===x));
      const cents = Math.round((+e.amount||0)*100);
      const sh = e.split==="exact" && e.shares ? splitCents(cents, among, "exact", e.shares).shares : splitCents(cents, among, "equal").shares;
      const rows = [e.paidBy, ...among.filter(x=>x!==e.paidBy)].filter(x=>among.includes(x) || x===e.paidBy).map(x=>{
        const part = (sh[x]||0)/100; const isP = x===e.paidBy;

        const owes = isP ? (among.includes(x) ? `${pv} ${money(e.amount)} · ${sp} ${money(part)}` : `${pv} ${money(e.amount)}`) : `${x===ME?"debes":"debe"} ${money(part)} a ${esc(e.paidBy===ME?"ti":nm(e.paidBy))}`;

      }).join("");
      return `<details class="exp"><summary>${mav(e.paidBy,"sm")}<div class="main"><div class="t1">${esc(e.concept||"Gasto")}</div><div class="d">${esc(nm(e.paidBy))} ${e.paidBy===ME?"pusiste":"puso"} ${money(e.amount)} · ${fmtShort(e.date)}</div></div><span class="a">${money(e.amount)}</span><span class="chev">${ICON.chev}</span></summary>
        <div class="break">${rows}<div class="foot"><span>${e.split==="exact"?"Partes distintas":"A partes iguales"} entre ${plural(among.length,"persona","personas")}</span><button type="button" class="rm" data-rmexp="${esc(e.id)}">Quitar gasto</button></div></div></details>`;
    }).join("")}</div><p class="hint" style="text-align:center">Toca un gasto para ver qué le toca a cada uno.</p>` : `<p class="hint" style="padding:6px 4px">Aún no hay gastos. Pulsa «Añadir gasto».</p>`;

    openSheet(head(g.name, {av:`<span class="av sm sq" style="--h:${hue(g.name)}" aria-hidden="true">${esc(initials(g.name))}</span>`}) + `
      <div class="hero-d">
        <span class="lbl">${mine>0?"Te deben":mine<0?"Debes":"Estás en paz"}</span>
        <span class="big ${mine>0?"pos":mine<0?"neg":""}">${money(Math.abs(mine))}</span>
        <span class="lbl">${money(c.total)} gastados entre ${plural(g.members.length,"persona","personas")}</span>

      </div>
      <div id="gPane" class="${reduced?"":"enter-bar"}">${groupTab==="resumen"?resumenHtml:gastosHtml}</div>
      ${g.example?'<p class="hint" style="text-align:center">Este grupo es un ejemplo. Bórralo cuando quieras.</p>':""}
      <div class="grid2">
        <button type="button" class="btn ghost" data-act="editgroup">Editar</button>
        <button type="button" class="btn ghost" data-act="askdelgroup" style="color:var(--bad)">Borrar</button>
      </div>
      <div id="confirmBox"></div>`, "group:"+id, {back});
    sheet.querySelectorAll("[data-gtab]").forEach(b=>b.addEventListener("click", ()=>{
      groupTab = b.dataset.gtab; moveSeg(b);
      const p = $("#gPane"); p.innerHTML = groupTab==="resumen"?resumenHtml:gastosHtml;
      if (!reduced){ p.style.animation="none"; void p.offsetWidth; p.style.animation="rise .35s var(--ease)"; }

  function askImport(data){
        if (!data || !Array.isArray(data.debts) || !Array.isArray(data.groups)) throw new Error("formato");

  const canFiles = !window.claude;

  // ---------- actualizaciones ----------
  // APP_BUILD lo rellena GitHub Actions al publicar (es el número de la versión).
  const REPO = "N23GR045/Reparto-de-deudas-";
  const APP_BUILD = parseInt("__APP_BUILD__", 10) || 0;
  const isApk = !!window.Capacitor;
  const canUpdate = !window.claude;
  const UPD_EVERY = 6 * 3600 * 1000;
  const upd = {state:"idle", build:0, name:"", notes:[], url:"", page:"", date:"", swReady:false};
  const verName = b => b ? "1." + b : "de desarrollo";
  function notesFrom(body){
    const txt = String(body||"");
    const m = txt.match(/##\s*Novedades\s*\n([\s\S]*?)(\n##|\n\*\*Instalar|$)/i);
    return (m ? m[1] : "").split("\n").map(l=>l.replace(/^[\s>*\-•]+/,"").replace(/[`*_]/g,"").trim())
      .filter(l=>l && !/^(co-authored-by|claude-session|signed-off-by)/i.test(l)).slice(0,8);
  }
  function applyRelease(j){
    upd.build = parseInt(String(j.tag_name||"").replace(/\D+/g,""),10) || 0;
    upd.name = j.name || ("Versión " + verName(upd.build));
    upd.notes = notesFrom(j.body);
    const asset = (j.assets||[]).find(a=>/\.apk$/i.test(a.name||""));
    upd.url = asset ? asset.browser_download_url : (j.html_url||"");
    upd.page = j.html_url || `https://github.com/${REPO}/releases`;
    upd.date = j.published_at || "";
    upd.state = (APP_BUILD && upd.build > APP_BUILD) ? "available" : (APP_BUILD ? "uptodate" : "unknown");
  }
  async function checkUpdates(manual){
    if (!canUpdate) return;
    if (!manual){
      if (!S.autoUpdate) return;
      try { const c = JSON.parse(localStorage.getItem("rd-upd-cache")||"null"); if (c && Date.now()-c.at < UPD_EVERY){ applyRelease(c.rel); refreshUpd(); return; } } catch(e){}
    }
    upd.state = "checking"; refreshUpd();
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`, {headers:{Accept:"application/vnd.github+json"}, cache:"no-store"});
      if (!r.ok) throw new Error("http " + r.status);
      const j = await r.json();
      const rel = {tag_name:j.tag_name, name:j.name, body:j.body, html_url:j.html_url, published_at:j.published_at, assets:(j.assets||[]).map(a=>({name:a.name, browser_download_url:a.browser_download_url}))};
      try { localStorage.setItem("rd-upd-cache", JSON.stringify({at:Date.now(), rel})); } catch(e){}
      applyRelease(rel);
    } catch(e){ upd.state = (navigator.onLine===false) ? "offline" : "error"; }
    refreshUpd();
    if (manual){
      if (upd.state==="uptodate") toast("Tienes la última versión");
      else if (upd.state==="available") toast("Hay una versión nueva");
      else if (upd.state==="offline") toast("Sin conexión. Inténtalo más tarde.");
      else if (upd.state==="error") toast("No se pudo comprobar. Inténtalo más tarde.");
    }
  }
  function refreshUpd(){
    if (sheetRef==="settings" && !dirty){ const box = $("#updBox"); if (box) box.outerHTML = updSettingsHTML(); }
    const ban = $("#updBanner"), want = updBanner();
    if (ban && !want) ban.remove();
    else if (!ban && want) $("#view").insertAdjacentHTML("afterbegin", want);
  }
  function dismissed(){ try { return +localStorage.getItem("rd-upd-skip") || 0; } catch(e){ return 0; } }
  function updAction(cls){
    if (isApk) return `<a class="btn ${cls||""}" href="${esc(upd.url)}">Descargar e instalar</a>`;
    return `<button type="button" class="btn ${cls||""}" data-act="applyupd">Actualizar ahora</button>`;
  }
  function updBanner(){
    if (!canUpdate) return "";
    const webReady = !isApk && upd.swReady;
    if (!(upd.state==="available" && upd.build > dismissed()) && !webReady) return "";
    const title = webReady && upd.state!=="available" ? "La app se ha actualizado" : `Nueva versión ${verName(upd.build)}`;
    const sub = isApk ? "Descárgala e instálala encima. No perderás tus datos." : "Recarga para usarla. Tus datos se mantienen.";
    return `<section class="upd stg" id="updBanner" role="status">
      <div class="u1"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span><div><b>${esc(title)}</b><span>${sub}</span></div></div>
      ${upd.notes.length && upd.state==="available" ? `<ul>${upd.notes.slice(0,3).map(n=>`<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      <div class="btnrow">${updAction("small")}<button type="button" class="btn ghost small" data-act="skipupd">Ahora no</button></div>
    </section>`;
  }
  function updSettingsHTML(){
    const status = {checking:"Buscando…", available:`Hay una versión nueva: ${verName(upd.build)}`, uptodate:"Tienes la última versión", unknown: upd.build ? `Última versión publicada: ${verName(upd.build)}` : "", offline:"Sin conexión", error:"No se pudo comprobar", idle:""}[upd.state] || "";
    return `<div class="card" id="updBox">
      <p class="step-t">Actualizaciones</p>
      <div class="vrow"><span>Versión instalada</span><b>${verName(APP_BUILD)}${isApk?" · Android":" · web"}</b></div>
      ${status?`<div class="vrow"><span>Estado</span><b style="color:${upd.state==="available"?"var(--accent)":upd.state==="error"||upd.state==="offline"?"var(--bad)":"var(--ink)"}">${esc(status)}</b></div>`:""}
      ${upd.notes.length ? `<div><p class="hint" style="margin-bottom:6px">Novedades de la ${verName(upd.build)}${upd.date?" · "+fmtDate(upd.date.slice(0,10)):""}</p><ul class="notes">${upd.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
      <div class="grid2">${upd.state==="available" ? updAction() : `<button type="button" class="btn soft" data-act="checkupd" ${upd.state==="checking"?"disabled":""}>Buscar ahora</button>`}
        <a class="btn ghost" href="https://github.com/${REPO}/releases" target="_blank" rel="noopener">Todas las versiones</a></div>
      <label class="switch"><span>Buscar actualizaciones al abrir</span><input type="checkbox" data-toggle="autoUpdate" ${S.autoUpdate?"checked":""}></label>
      ${!APP_BUILD ? `<p class="hint">Esta copia no viene de una versión publicada, así que no se puede comparar. Instala la app desde GitHub para recibir avisos.</p>` : ""}
    </div>`;
  }
  async function applyWebUpdate(){
    try {
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg){ await reg.update().catch(()=>{}); if (reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"}); }
    } catch(e){}
    setTimeout(()=>location.reload(), 300);
  }
  if (canUpdate && !isApk && "serviceWorker" in navigator){
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if (hadController){ upd.swReady = true; refreshUpd(); } });
  }
  if (canUpdate){
    setTimeout(()=>checkUpdates(false), 1500);
    document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") checkUpdates(false); });
    try { const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App; if (App) App.addListener("resume", ()=>checkUpdates(false)); } catch(e){}
  }
  let pendingImport = null;
  async function exportData(){
    const json = JSON.stringify({app:"reparto-de-deudas", version:1, exportedAt:new Date().toISOString(), debts, groups, settings:S});
    if (window.Capacitor){
      try { await navigator.clipboard.writeText(json); toast("Copia copiada. Pégala en una nota o en WhatsApp para guardarla."); }
      catch(_){
        $("#confirmBox").innerHTML = `<div class="notice"><span>Mantén pulsado el texto para copiarlo y guárdalo donde quieras.</span><textarea readonly rows="5" id="expText"></textarea></div>`;
        $("#expText").value = json; $("#expText").select();
      }
      return;
    }
    const blob = new Blob([json], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "reparto-de-deudas-" + todayISO() + ".json";
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast("Copia descargada");
  }
  function importData(){
    const data = pendingImport; pendingImport = null; if (!data) return;
    debts = data.debts.filter(d=>d && d.id && d.name!=null && d.amount!=null);
    groups = data.groups.filter(g=>g && g.id && Array.isArray(g.members));
    if (data.settings) { S = Object.assign({}, DEFAULTS, data.settings); applySettings(); try{ localStorage.setItem("me-deben-ajustes", JSON.stringify(S)); }catch(e){} }
    lsWrite(); animateNext = true; render(); showSettings(); toast("Copia importada");
  }

  // ---------- ejemplos ----------
  async function loadDebtExamples(){
    const ex = [
      {name:"Carlos (ejemplo)", concept:"Entradas del concierto", amount:85, lentOn:addDays(-40), dueOn:addDays(-5), payments:[], extras:[]},
      {name:"Lucía (ejemplo)", concept:"Fianza del piso", amount:600, lentOn:addDays(-60), dueOn:addDays(30), payments:[{id:uid("p"),amount:200,date:addDays(-30)},{id:uid("p"),amount:150,date:addDays(-2)}], extras:[{id:uid("x"),amount:120,date:addDays(-15),note:"Gastos de la mudanza"}]},
      {name:"Andrés (ejemplo)", concept:"Cena de cumpleaños", amount:42.5, lentOn:addDays(-10), dueOn:addDays(4), payments:[], extras:[]},
      {name:"Marta (ejemplo)", concept:"Gasolina del viaje", amount:30, lentOn:addDays(-20), dueOn:"", payments:[{id:uid("p"),amount:30,date:addDays(-8)}], extras:[]}
    ];
    for (const e of ex){ try{ await save("debts", Object.assign({id:uid("d"), example:true, createdAt:new Date().toISOString(), phone:"", notes:""}, e), true); }catch(_){ return; } }
    animateNext = true; render(); toast("Ejemplos cargados");
  }
  async function loadGroupExample(){
    const L=uid("m"), A=uid("m"), M=uid("m"); const all=[ME,L,A,M];
    const g = {id:uid("g"), example:true, name:"Casa rural (ejemplo)", createdAt:new Date().toISOString(),
      members:[{id:ME,name:"Yo"},{id:L,name:"Lucía"},{id:A,name:"Andrés"},{id:M,name:"Marta"}],
      expenses:[
        {id:uid("e"), concept:"Alquiler de la casa", amount:320, paidBy:ME, among:all, split:"equal", date:addDays(-6)},
        {id:uid("e"), concept:"Supermercado", amount:86.4, paidBy:L, among:all, split:"equal", date:addDays(-5)},
        {id:uid("e"), concept:"Gasolina", amount:54, paidBy:A, among:[ME,A,M], split:"equal", date:addDays(-5)},
        {id:uid("e"), concept:"Cena del sábado", amount:112, paidBy:ME, among:all, split:"exact", shares:{[ME]:30,[L]:24,[A]:30,[M]:28}, date:addDays(-4)}
      ]};
    try { await save("groups", g); } catch(_){ return; }
    toast("Grupo de ejemplo cargado"); showGroup(g.id);
  }
  async function clearExamples(){
    const dx = debts.filter(d=>d.example).map(d=>d.id), gx = groups.filter(g=>g.example).map(g=>g.id);
    if (!dx.length && !gx.length){ toast("No hay ejemplos que borrar"); return; }
    for (const id of dx){ try{ await remove("debts", id); }catch(_){ return; } }
    for (const id of gx){ try{ await remove("groups", id); }catch(_){ return; } }
    toast("Ejemplos borrados");
  }

  // ---------- eventos ----------
  document.addEventListener("click", async e=>{
    const t = e.target.closest("button"); if (!t || t.disabled) return;
    if (t.dataset.tab){ if (tab!==t.dataset.tab){ tab = t.dataset.tab; animateNext = true; render(); window.scrollTo({top:0}); } return; }
    if (t.dataset.f){ filter = t.dataset.f; try{localStorage.setItem("me-deben-filter",filter);}catch(_){} moveSeg(t); const l=$("#dlist"); if (l){ l.innerHTML = debtRows(); if(!reduced){ l.style.animation="none"; void l.offsetWidth; l.style.animation="rise .35s var(--ease)"; } } return; }
    if (t.dataset.open){ const r = t.dataset.open; if (r==="add") addChooser(); else if (r.startsWith("pick:")) pickDebt(r.slice(5)); else openRef(r, false, !!t.dataset.back); return; }
    if (t.dataset.set){ const v = t.dataset.val; const num = ["fs","soonDays","defaultDue"].includes(t.dataset.set); if (t.closest(".seg")) moveSeg(t); setSetting(t.dataset.set, num ? +v : v); if (t.dataset.set==="accent"||t.dataset.set==="theme"||t.dataset.set==="fs"||t.dataset.set==="corners") showSettings(); else sheet.querySelectorAll(`[data-set="${t.dataset.set}"]`).forEach(b=>b.setAttribute("aria-pressed", String(b===t))); return; }
    if (t.dataset.pick){ showDebt(t.dataset.pick, t.dataset.purpose==="more" ? "more" : undefined); return; }
    if (t.dataset.mergeinto){
      const m = debts.find(x=>x.id===t.dataset.mergeinto); if (!m) return;
      const amt = parseAmount($("#fAmount").value);
      if (!(amt>0)){ const err=$("#fErr"); err.textContent="Escribe primero el importe que quieres sumar."; err.hidden=false; $("#fAmount").focus(); return; }
      await addExtra(m, amt, $("#fLent").value, $("#fConcept").value.trim(), $("#fDue").value || m.dueOn || "");
      return;
    }
    const cur = sheetRef ? sheetRef.split(":") : [];
    const d = cur[0]==="debt" ? debts.find(x=>x.id===cur[1]) : null;
    const g = cur[0]==="group" ? groups.find(x=>x.id===cur[1]) : null;
    if (t.dataset.rmmv && d){
      const [k,id] = t.dataset.rmmv.split(":");
      const next = Object.assign({}, d);
      if (k==="in") next.payments = (d.payments||[]).filter(p=>p.id!==id); else next.extras = (d.extras||[]).filter(x=>x.id!==id);
      if (restOf(next) > 0) delete next.settledAt;
      try { await save("debts", next); } catch(_){ return; } toast("Movimiento quitado"); showDebt(d.id); return;
    }
    if (t.dataset.rmexp && g){
      try { await save("groups", Object.assign({}, g, {expenses:(g.expenses||[]).filter(x=>x.id!==t.dataset.rmexp)})); } catch(_){ return; }
      toast("Hecho"); showGroup(g.id); return;
    }
    if (t.dataset.settle && g){
      const [from,to,amt] = t.dataset.settle.split("|");
      try { await save("groups", Object.assign({}, g, {expenses:[...(g.expenses||[]), {id:uid("s"), type:"settle", from, to, amount:+amt, date:todayISO()}]})); } catch(_){ return; }
      toast("Pago apuntado en el grupo"); showGroup(g.id); return;
    }
    if (t.dataset.tomedeben && g){
      const [from, amt] = t.dataset.tomedeben.split("|"); const a = +amt; const name = memberName(g, from);
      const existing = debts.find(x=>norm(x.name)===norm(name) && statusOf(x).key!=="done");
      try {
        if (existing) await save("debts", Object.assign({}, existing, {extras:[...(existing.extras||[]), {id:uid("x"), amount:a, date:todayISO(), note:"Grupo " + g.name}]}), true);
        else await save("debts", {id:uid("d"), name, amount:a, concept:g.name, lentOn:todayISO(), dueOn: S.defaultDue ? addDays(S.defaultDue) : "", phone:"", notes:"Viene de un reparto en grupo.", payments:[], extras:[], fromGroup:g.id, createdAt:new Date().toISOString(), example: g.example || undefined}, true);
        await save("groups", Object.assign({}, g, {expenses:[...(g.expenses||[]), {id:uid("s"), type:"settle", from, to:ME, amount:a, date:todayISO(), note:"pasado a Me deben"}]}));
      } catch(_){ return; }
      toast(`${clean(name)} ahora está en Me deben`); showGroup(g.id); return;
    }
    const act = t.dataset.act; if (!act) return;
    if (act==="close") closeSheet();
    else if (act==="newdebt") { if (ready) debtForm(); }
    else if (act==="moredebt") pickDebt("more");
    else if (act==="paypick") pickDebt("pay");
    else if (act==="quick") { if (ready) quickSplit(); }
    else if (act==="newgroup") { if (ready) groupForm(); }
    else if (act==="exdebts") loadDebtExamples();
    else if (act==="exgroups") loadGroupExample();
    else if (act==="editdebt" && d) debtForm(d);
    else if (act==="editgroup" && g) groupForm(g);
    else if (act==="addexp" && g) expenseForm(g.id);
    else if (act==="gpadd" && g){
      const inp = $("#gpNew"), n = inp.value.trim(); if (!n) return;
      if (g.members.some(m=>norm(m.name)===norm(n))){ toast(n+" ya está en el grupo"); return; }
      try { await save("groups", Object.assign({}, g, {members:[...g.members, {id:uid("m"), name:n}]})); } catch(_){ return; }
      toast(n+" añadido al grupo"); showGroup(g.id);
    }
    else if (act==="payall" && d) addPayment(d, restOf(d), todayISO());
    else if (act==="settings") showSettings();
    else if (act==="export") exportData();
    else if (act==="checkupd") checkUpdates(true);
    else if (act==="applyupd") applyWebUpdate();
    else if (act==="skipupd"){ try { localStorage.setItem("rd-upd-skip", String(upd.build)); } catch(_){} upd.swReady = false; refreshUpd(); }
    else if (act==="pastecopy"){
      $("#confirmBox").innerHTML = `<div class="notice"><span>Pega aquí el texto de tu copia.</span><textarea rows="5" id="pasteText" placeholder='{"app":"reparto-de-deudas"…'></textarea><button type="button" class="btn small" data-act="checkpaste">Revisar copia</button></div>`;
      $("#pasteText").focus();
    }
    else if (act==="checkpaste"){ try { askImport(JSON.parse($("#pasteText").value)); } catch(_){ toast("Ese texto no es una copia de Reparto de Deudas"); } }
    else if (act==="doimport") importData();
    else if (act==="resettpl"){ setSetting("template", DEFAULT_TPL); showSettings(); }
    else if (act==="clearex"){ await clearExamples(); if (sheetRef==="settings") showSettings(); }
    else if (act==="resetsettings"){
      $("#confirmBox").innerHTML = `<div class="confirm"><span>¿Volver a los ajustes de fábrica? Tus deudas y grupos no se borran.</span>
        <div class="grid2"><button type="button" class="btn danger small" data-act="doreset">Restablecer</button><button type="button" class="btn ghost small" data-act="nodel">Cancelar</button></div></div>`;
      $("#confirmBox").scrollIntoView({block:"nearest", behavior: reduced ? "auto" : "smooth"});
    }
    else if (act==="doreset"){ S = Object.assign({}, DEFAULTS); setSetting("theme", "system"); showSettings(); toast("Ajustes restablecidos"); }
    else if (act==="copy" && d){
      const txt = reminderText(d);
      try { await navigator.clipboard.writeText(txt); toast("Mensaje copiado"); }
      catch(_){ const r=document.createRange(); r.selectNodeContents($("#msg")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texto seleccionado: cópialo con el menú del iPhone"); }
    }
    else if ((act==="askdel" && d) || (act==="askdelgroup" && g)){
      const what = d ? `la deuda de <b>${esc(d.name)}</b> con todos sus movimientos` : `el grupo <b>${esc(g.name)}</b> y todos sus gastos`;
      $("#confirmBox").innerHTML = `<div class="confirm"><span>¿Borrar ${what}? No se puede deshacer.</span>
        <div class="grid2"><button type="button" class="btn danger small" data-act="${d?"del":"delgroup"}">Sí, borrar</button><button type="button" class="btn ghost small" data-act="nodel">Cancelar</button></div></div>`;
      $("#confirmBox").scrollIntoView({block:"nearest", behavior: reduced ? "auto" : "smooth"});
    }
    else if (act==="nodel") $("#confirmBox").innerHTML = "";
    else if (act==="del" && d){ const n=d.name; try{ await remove("debts", d.id); }catch(_){ return; } closeSheet(); toast(`Deuda de ${clean(n)} borrada`); }
    else if (act==="delgroup" && g){ const n=g.name; try{ await remove("groups", g.id); }catch(_){ return; } closeSheet(); toast(`Grupo ${clean(n)} borrado`); }
  });
  $("#addBtn").addEventListener("click", ()=>{ if (!ready) return; tab==="debts" ? addChooser() : quickSplit(); });
  $("#settingsBtn").addEventListener("click", ()=>showSettings());
  document.addEventListener("input", e=>{ if (e.target.id==="q"){ query = e.target.value; const l=$("#dlist"); if (l) l.innerHTML = debtRows(); } });
  window.addEventListener("resize", ()=>{ placeSegs(document); });
  document.addEventListener("change", e=>{ const t = e.target; if (t && t.dataset && t.dataset.toggle) setSetting(t.dataset.toggle, t.checked); });

  let tt; function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"), 2600); }

  // Botón «atrás» de Android (solo en la app instalada desde el APK)
  try {
    const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (App) App.addListener("backButton", ()=>{
      if (!shade.hidden && shade.classList.contains("open")){ const b = sheet.querySelector("[data-back]"); if (b) b.click(); else closeSheet(); }
      else if (tab!=="debts"){ tab = "debts"; animateNext = true; render(); }
      else App.exitApp();
    });
  } catch(e){}

  boot();
})();
</script>

<script>
  if ("serviceWorker" in navigator && location.protocol === "https:" && !window.Capacitor) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>
</body>
</html>
