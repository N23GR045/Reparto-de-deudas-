  }

  async function addPayment(d, amt, date){
    const err = $("#pErr");
    if (!(amt>0)){ err.textContent="Escribe cuánto te ha devuelto, por ejemplo 50."; err.hidden=false; return; }
    const rest = restOf(d);
    if (amt > rest + 0.001){ err.textContent=`El pago supera lo que falta (${money(rest)}).`; err.hidden=false; return; }
    const pid = uid("p");
    const next = Object.assign({}, d, {payments:[...(d.payments||[]), {id:pid, amount:amt, date:date||todayISO()}]});
    if (restOf(next) <= 0) next.settledAt = new Date().toISOString();
    try { await save("debts", next); } catch(_){ return; }
    showDebt(d.id);
    toast(restOf(next)<=0 ? `¡${clean(d.name)} ha pagado toda la deuda!` : `Pago de ${money(amt)} guardado`, {label:"Deshacer", fn: async ()=>{
      const cur = debts.find(x=>x.id===d.id); if (!cur) return;
      const back = Object.assign({}, cur, {payments:(cur.payments||[]).filter(p=>p.id!==pid)}); delete back.settledAt;
      try { await save("debts", back); } catch(_){ return; }
      if (sheetRef==="debt:"+d.id) showDebt(d.id); toast("Pago deshecho");
    }});
  }
  async function addExtra(d, amt, date, note, due, err){
    if (!(amt>0)){ if (err){ err.textContent="Escribe cuánto le prestas, por ejemplo 100."; err.hidden=false; } return; }
    const next = Object.assign({}, d, {extras:[...(d.extras||[]), {id:uid("x"), amount:amt, date:date||todayISO(), note:note||""}]});
    if (due !== undefined) next.dueOn = due;
    delete next.settledAt;
    try { await save("debts", next); } catch(_){ return; }
    toast(`Sumados ${money(amt)}. Ahora te debe ${money(restOf(next))}`);
    showDebt(d.id);
  }

  // ---------- editor de reparto «Para quién» (compartido) ----------
  // st = {amount, payer, among:Set, mode:"equal"|"parts"|"exact", exact:{}, weights:{}, members:[{id,name}]}
  function splitEditorHTML(st, opts){
    return `<div class="card">
        <div class="seg" role="group" aria-label="Cómo dividir">
          <button type="button" data-semode="equal" aria-pressed="${st.mode==="equal"}">A partes iguales</button>
          <button type="button" data-semode="parts" aria-pressed="${st.mode==="parts"}">Por partes</button>
          <button type="button" data-semode="exact" aria-pressed="${st.mode==="exact"}">Por importes</button>
        </div>
        <div class="fw-head"><p class="step-t">Para quién</p><button type="button" class="linkbtn" id="seAll">Todos</button></div>
        <div class="fw-list" id="seList"></div>
        ${opts.addPeople ? `<div class="addperson"><input id="seNew" autocomplete="off" placeholder="Añadir persona" aria-label="Nombre de la persona"><button type="button" class="btn ghost" id="seAdd">Añadir</button></div><div class="chips" id="seSugg"></div>` : ""}
        <div id="seBalance"></div>
      </div>`;
  }
  function mountSplitEditor(st, opts){
    st.weights = st.weights || {}; st.exact = st.exact || {};
    const nm = id => id===ME ? "Yo" : (st.members.find(m=>m.id===id)||{name:"?"}).name;
    const ids = () => st.members.map(m=>m.id).filter(id=>st.among.has(id));
    const wOf = id => (id in st.weights) ? st.weights[id] : 1;
    const weightsMap = () => Object.fromEntries(ids().map(id=>[id, wOf(id)]));
    const calc = () => { const cents = Math.round((st.amount||0)*100), list = ids();
      return splitCents(cents, list, st.mode, st.mode==="parts" ? weightsMap() : st.exact); };
    const drawList = () => {
      const res = calc();
      $("#seList").innerHTML = st.members.map(m=>{
        const on = st.among.has(m.id), name = m.id===ME ? "Yo" : m.name;
        const sub = opts.sub ? opts.sub(m.id, on, st) : "";
        let ctrl = "";
        if (on && st.mode==="parts") ctrl = `<span class="stepper"><button type="button" data-wdec="${esc(m.id)}" aria-label="Menos partes">−</button><b data-w="${esc(m.id)}">${wOf(m.id)}</b><button type="button" data-winc="${esc(m.id)}" aria-label="Más partes">+</button></span>`;
        const right = on && st.mode==="exact"
          ? `<input class="fw-in" inputmode="decimal" data-exact="${esc(m.id)}" value="${esc(st.exact[m.id]||"")}" placeholder="0,00" aria-label="Importe de ${esc(name)}">`
          : `<span class="fw-a" data-amt="${esc(m.id)}">${on ? money((res.shares[m.id]||0)/100) : ""}</span>`;
        return `<div class="fw ${on?"":"off"}" data-row="${esc(m.id)}"><button type="button" class="ck" data-among="${esc(m.id)}" aria-pressed="${on}" aria-label="Incluir a ${esc(name)}">${ICON.tick}</button>${avatar(name,"sm")}<span class="fw-n">${esc(name)}${sub?`<small data-sub="${esc(m.id)}">${sub}</small>`:""}</span>${ctrl}${right}</div>`;
      }).join("");
      $("#seAll").textContent = ids().length===st.members.length ? "Ninguno" : "Todos";
      if (opts.addPeople){
        const sg = knownPeople(st.members.map(m=>m.name));
        $("#seSugg").innerHTML = sg.map(n=>`<button type="button" class="chip sugg" data-sugg="${esc(n)}">+ ${esc(n)}</button>`).join("");
      }
      drawNumbers();
    };
    const drawNumbers = () => {
      const res = calc(), list = ids(), cents = Math.round((st.amount||0)*100);
      sheet.querySelectorAll("[data-amt]").forEach(el=>{ const id = el.dataset.amt; el.textContent = st.among.has(id) ? money((res.shares[id]||0)/100) : ""; });
      if (opts.sub) sheet.querySelectorAll("[data-sub]").forEach(el=>{ const id = el.dataset.sub; el.innerHTML = opts.sub(id, st.among.has(id), st); });
      const bal = $("#seBalance");
      if (!list.length) bal.innerHTML = `<div class="balance-line bad">Marca al menos a una persona.</div>`;
      else if (!cents) bal.innerHTML = `<div class="balance-line">Escribe el importe para ver cuánto le toca a cada uno.</div>`;
      else if (st.mode==="exact"){
        const d = res.diff/100;
        bal.innerHTML = Math.abs(d)<0.005 ? `<div class="balance-line ok">Cuadra: suman ${money(st.amount)}.</div>`
          : d>0 ? `<div class="balance-line">Falta repartir ${money(d)}.</div>` : `<div class="balance-line bad">Te pasas en ${money(-d)}.</div>`;
      } else if (st.mode==="parts"){
        const tw = list.reduce((a,id)=>a+wOf(id),0);
        bal.innerHTML = tw ? `<div class="balance-line">${plural(tw,"parte","partes")} · ${money(st.amount/tw)} cada parte</div>` : `<div class="balance-line bad">Pon al menos una parte.</div>`;
      } else bal.innerHTML = `<div class="balance-line">${plural(list.length,"persona","personas")} · ${money(st.amount/list.length)} cada una</div>`;
      if (opts.onChange) opts.onChange(res);
    };
    st.redraw = drawList;
    st.refreshNumbers = drawNumbers;
    st.valid = () => { const list = ids(), cents = Math.round((st.amount||0)*100);
      if (!(cents>0)) return "Escribe el importe."; if (!list.length) return "Marca al menos a una persona.";
      if (st.mode==="exact" && calc().diff !== 0) return "Los importes tienen que sumar el total.";
      if (st.mode==="parts" && !list.some(id=>wOf(id)>0)) return "Pon al menos una parte."; return ""; };
    st.shares = () => { const r = calc(); return Object.fromEntries(ids().map(id=>[id, r.shares[id]/100])); };
    st.weightsOut = weightsMap;

    const root = sheet.querySelector(".sc");
    const toggle = k => { st.among.has(k) ? st.among.delete(k) : st.among.add(k); dirty = true; drawList(); };
    root.addEventListener("click", e=>{
      const b = e.target.closest("button");
      if (b && root.contains(b)){
        if (b.dataset.among){ toggle(b.dataset.among); return; }
        if (b.dataset.winc || b.dataset.wdec){ const k = b.dataset.winc || b.dataset.wdec; st.weights[k] = Math.max(0, Math.min(99, wOf(k) + (b.dataset.winc ? 1 : -1))); const el = sheet.querySelector(`[data-w="${CSS.escape(k)}"]`); if (el) el.textContent = st.weights[k]; dirty = true; drawNumbers(); return; }
        if (b.id==="seAll"){ if (ids().length===st.members.length) st.among.clear(); else st.members.forEach(m=>st.among.add(m.id)); dirty = true; drawList(); return; }
        if (b.dataset.semode){ st.mode = b.dataset.semode; moveSeg(b); dirty = true; drawList(); return; }
        if (b.dataset.sugg){ addPerson(b.dataset.sugg); return; }
        if (b.id==="seAdd"){ const i=$("#seNew"); addPerson(i.value); i.value=""; i.focus(); return; }
        return;
      }
      const row = e.target.closest(".fw");
      if (row && root.contains(row) && !e.target.closest("input,.stepper")) toggle(row.dataset.row);
    });
    root.addEventListener("input", e=>{ if (e.target.dataset && e.target.dataset.exact){ st.exact[e.target.dataset.exact] = e.target.value; drawNumbers(); } });
    const addPerson = name => {
      name = String(name||"").trim(); if (!name) return;
      if (st.members.some(m=>norm(m.name)===norm(name)) || norm(name)==="yo"){ toast(name+" ya está en la lista"); return; }
      const m = {id:uid("m"), name}; st.members.push(m); st.among.add(m.id); dirty = true; drawList();
    };
    if (opts.addPeople) $("#seNew").addEventListener("keydown", e=>{ if (e.key==="Enter"){ e.preventDefault(); addPerson(e.target.value); e.target.value=""; } });
    drawList();
  }

  // --- dividir una cuenta (reparto rápido) ---
  function quickSplit(){
    const st = {amount:0, payer:ME, among:new Set([ME]), mode:"equal", exact:{}, weights:{}, members:[{id:ME,name:"Yo"}]};
    openSheet(head("Dividir una cuenta", {back: sheetRef==="add" ? "add" : null}) + `
      <div class="amountbox"><span class="q">¿Cuánto pagaste?</span>
        <input class="amount-in" id="qAmt" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Importe total">
        <span class="cur">${esc(curSym)}</span></div>
      <label>¿De qué era?<input id="qConcept" autocomplete="off" placeholder="Ej. cena del viernes"></label>
      ${splitEditorHTML(st, {addPeople:true})}
      <p class="err" id="qErr" hidden></p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button type="button" class="btn wide" id="qSave" disabled>Apuntar en Me deben</button>
        <button type="button" class="linkbtn" id="qGroup" style="align-self:center">Guardar como grupo para seguir añadiendo gastos</button>
      </div>`, "quick", {focus:"#qAmt"});
    const btn = $("#qSave");
    const others = () => [...st.among].filter(id=>id!==ME);
    const update = () => {
      const n = others().length;
      btn.disabled = !!st.valid() || !n;
      btn.textContent = n ? `Apuntar ${n===1?"1 deuda":n+" deudas"} en Me deben` : "Añade a quien te debe";
    };
    mountSplitEditor(st, {addPeople:true, sub:(id,on)=> on ? (id===ME ? "tu parte" : "te debe") : "no participa", onChange:update});
    $("#qAmt").addEventListener("input", e=>{ st.amount = parseAmount(e.target.value)||0; st.refreshNumbers(); update(); });
    update();
    btn.addEventListener("click", async ()=>{
      const v = st.valid(); if (v){ const err=$("#qErr"); err.textContent=v; err.hidden=false; return; }
      const concept = $("#qConcept").value.trim() || "Cuenta compartida";
      const shares = st.shares(); let n = 0;
      btn.disabled = true;
      for (const id of others()){
        const amt = shares[id]; if (!(amt>0)) continue;
        const name = st.members.find(m=>m.id===id).name;
        const existing = debts.find(x=>norm(x.name)===norm(name) && statusOf(x).key!=="done");
        try {
          if (existing) await save("debts", Object.assign({}, existing, {extras:[...(existing.extras||[]), {id:uid("x"), amount:amt, date:todayISO(), note:concept}]}), true);
          else await save("debts", {id:uid("d"), name, amount:amt, concept, lentOn:todayISO(), dueOn: S.defaultDue ? addDays(S.defaultDue) : "", phone:"", notes:"", payments:[], extras:[], createdAt:new Date().toISOString()}, true);
          n++;
        } catch(_){ btn.disabled = false; return; }
      }
      closeSheet(); tab = "debts"; animateNext = true; render();
      toast(n===1 ? "1 deuda apuntada" : `${n} deudas apuntadas`);
    });
    $("#qGroup").addEventListener("click", async ()=>{
      const v = st.valid(); if (v){ const err=$("#qErr"); err.textContent=v; err.hidden=false; return; }
      const concept = $("#qConcept").value.trim() || "Cuenta compartida";
      const list = [...st.among];
      const g = {id:uid("g"), name:concept, createdAt:new Date().toISOString(), members: st.members.map(m=>({id:m.id,name:m.name})),
        expenses:[{id:uid("e"), concept, amount:st.amount, paidBy:ME, among:list, split:st.mode, date:todayISO()}]};
      if (st.mode==="exact") g.expenses[0].shares = st.shares();
      if (st.mode==="parts") g.expenses[0].weights = st.weightsOut();
      g.currency = S.currency; g.simplify = true;
      try { await save("groups", logged(g, `Grupo creado desde «Dividir una cuenta» con ${money(st.amount)}`)); } catch(_){ return; }
      tab = "split"; render(); toast("Grupo creado"); showGroup(g.id);
    });
  }

  // --- grupo: formulario ---
  function groupForm(g){
    const isNew = !g;
    let members = g ? g.members.map(m=>Object.assign({},m)) : [{id:ME,name:"Yo"}];
    const used = id => g && (g.expenses||[]).some(e=>e.paidBy===id || e.from===id || e.to===id || (e.among||[]).includes(id));
    const draw = () => {
      $("#gMembers").innerHTML = members.map(m=>`<span class="chip" aria-pressed="true">${avatar(m.name)}${esc(m.name)}${m.id===ME?"":(used(m.id)?"":`<button type="button" class="rm" data-rmmember="${esc(m.id)}" aria-label="Quitar a ${esc(m.name)}" style="padding:0 0 0 2px;min-height:0">✕</button>`)}</span>`).join("");
      const s = knownPeople(members.map(m=>m.name));
      $("#gSugg").innerHTML = s.map(n=>`<button type="button" class="chip sugg" data-gsugg="${esc(n)}">+ ${esc(n)}</button>`).join("");
    };
    openSheet(head(isNew?"Nuevo grupo":"Editar grupo", g?{back:"group:"+g.id}:{back: sheetRef==="add"?"add":null}) + `
      <form id="groupForm" novalidate>
        <label>Nombre<input id="gName" autocomplete="off" value="${esc(g?g.name:"")}" placeholder="Ej. Viaje a Valencia"></label>
        <div class="card">
          <p class="step-t">¿Quiénes participan?</p>
          <div class="chips" id="gMembers"></div>
          <div class="addperson"><input id="gNew" autocomplete="off" placeholder="Añadir persona" aria-label="Nombre de la persona"><button type="button" class="btn ghost" id="gAdd">Añadir</button></div>
          <div class="chips" id="gSugg"></div>
        </div>
        <div class="card">
          <p class="step-t">Ajustes del grupo</p>
          <label>Moneda del grupo<select id="gCur">${CURRENCIES.map(([c,l])=>`<option value="${c}" ${(g?gcur(g):S.currency)===c?"selected":""}>${l}</option>`).join("")}</select></label>
          <label class="switch"><span>Simplificar deudas<br><span class="hint">Calcula el mínimo de pagos. Si lo quitas, cada uno paga directamente a quien pagó por él.</span></span><input type="checkbox" id="gSimp" ${!g || g.simplify!==false ? "checked" : ""}></label>
          <label>Presupuesto (opcional)<input id="gBudget" inputmode="decimal" autocomplete="off" value="${g && g.budget ? String(g.budget).replace(".",",") : ""}" placeholder="Ej. 600"></label>
          ${g ? `<label class="switch"><span>Archivar grupo<br><span class="hint">Lo guarda aparte cuando ya está todo pagado.</span></span><input type="checkbox" id="gArch" ${g.archived?"checked":""}></label>` : ""}
        </div>
        <p class="err" id="gErr" hidden></p>
        <button class="btn wide" type="submit">${isNew?"Crear grupo":"Guardar"}</button>
      </form>`, isNew ? "newgroup" : "editgroup:"+g.id, {focus: isNew ? "#gName" : null});
    draw();
    const addMember = n => {
      n = String(n||"").trim(); if (!n) return;
      if (members.some(m=>norm(m.name)===norm(n)) || norm(n)==="yo"){ $("#gErr").textContent = n+" ya está en el grupo."; $("#gErr").hidden=false; return; }
      members.push({id:uid("m"), name:n}); $("#gErr").hidden=true; dirty = true; draw();
    };
    $("#gNew").addEventListener("keydown", e=>{ if (e.key==="Enter"){ e.preventDefault(); addMember(e.target.value); e.target.value=""; } });
    $("#gAdd").addEventListener("click", ()=>{ const i=$("#gNew"); addMember(i.value); i.value=""; i.focus(); });
    sheet.querySelector("form").addEventListener("click", e=>{
      const r = e.target.closest("[data-rmmember]"); if (r){ members = members.filter(m=>m.id!==r.dataset.rmmember); draw(); return; }
      const s = e.target.closest("[data-gsugg]"); if (s) addMember(s.dataset.gsugg);
    });
    $("#groupForm").addEventListener("submit", async e=>{
      e.preventDefault();
      if ($("#gNew").value.trim()){ addMember($("#gNew").value); $("#gNew").value=""; }
      const name = $("#gName").value.trim(), err = $("#gErr");
      if (!name){ err.textContent="Ponle un nombre al grupo."; err.hidden=false; return; }
      if (members.length < 2){ err.textContent="Añade al menos a otra persona."; err.hidden=false; return; }
      const budget = parseAmount($("#gBudget").value);
      let next = Object.assign({}, g||{}, {id: g?g.id:uid("g"), name, members, expenses: g?g.expenses||[]:[], createdAt: g?g.createdAt:new Date().toISOString(),
        currency: $("#gCur").value, simplify: $("#gSimp").checked, budget: budget>0 ? budget : null, archived: g && $("#gArch") ? $("#gArch").checked : false});
      if (!isNew) delete next.example;
      if (isNew) next = logged(next, `Grupo creado con ${members.map(m=>m.id===ME?"Tú":m.name).join(", ")}`);
      else {
        const added = members.filter(m=>!g.members.some(x=>x.id===m.id)).map(m=>m.name);
        const changes = [];
        if (g.name!==name) changes.push(`nombre a «${name}»`);
        if (gcur(g)!==next.currency) changes.push(`moneda a ${next.currency}`);
        if ((g.simplify!==false)!==next.simplify) changes.push(next.simplify ? "simplificar deudas activado" : "simplificar deudas desactivado");
        if ((g.budget||null)!==next.budget) changes.push(next.budget ? `presupuesto ${moneyC(next.budget, next.currency)}` : "sin presupuesto");
        if (!!g.archived!==next.archived) changes.push(next.archived ? "archivado" : "desarchivado");
        if (added.length) next = logged(next, `Añadido al grupo: ${added.join(", ")}`);
        if (changes.length) next = logged(next, `Cambiado: ${changes.join(", ")}`);
      }
      try { await save("groups", next); } catch(_){ return; }
      toast(isNew ? "Grupo creado" : "Grupo guardado");
      if (isNew){ tab = "split"; render(); expenseForm(next.id); } else showGroup(next.id, true);
    });
  }

  // --- grupo: gasto (nuevo o editar) ---
  function expenseForm(gid, eid){
    const g = groups.find(x=>x.id===gid); if (!g) return;
    const gc = gcur(g);
    const ex = eid ? (g.expenses||[]).find(x=>x.id===eid && x.type!=="settle") : null;
    const fmtIn = v => String(r2(v)).replace(".", ",");
    const exPayers = ex && ex.payers && Object.keys(ex.payers).length > 1 ? ex.payers : null;
    const st = {amount: ex ? +ex.amount : 0, payer: ex ? ex.paidBy : ME,
      among: new Set(ex ? (ex.among||[]) : g.members.map(m=>m.id)),
      mode: ex && (ex.split==="parts" || ex.split==="exact") ? ex.split : "equal",
      exact: ex && ex.shares ? Object.fromEntries(Object.entries(ex.shares).map(([k,v])=>[k, fmtIn(v)])) : {},
      weights: ex && ex.weights ? Object.assign({}, ex.weights) : {},
      members: g.members.map(m=>({id:m.id, name:m.id===ME?"Yo":m.name}))};
    const fx = {cur: ex && ex.origCurrency ? ex.origCurrency : gc, rate: ex && ex.rate ? ex.rate : 1, orig: ex ? (ex.origAmount!=null ? +ex.origAmount : +ex.amount) : 0};
    const multi = {on: !!exPayers, vals: exPayers ? Object.fromEntries(Object.entries(exPayers).map(([k,v])=>[k, fmtIn(v/(fx.rate||1))])) : {}};
    let cat = ex && ex.category ? ex.category : "";
    const curOpts = [gc, ...CURRENCIES.map(c=>c[0]).filter(c=>c!==gc)];
    openSheet(head(ex ? "Editar gasto" : "Nuevo gasto", {back:"group:"+gid}) + `
      <label>Título<input id="xConcept" autocomplete="off" value="${esc(ex?ex.concept:"")}" placeholder="Ej. supermercado, cena, gasolina"></label>
      <div class="chips" id="xCat" role="group" aria-label="Categoría">${CATS.map(([k,l,h])=>`<button type="button" class="chip plain catchip" data-cat="${k}" aria-pressed="${cat===k}" style="--ch:${h}"><span class="cdot"></span>${l}</button>`).join("")}</div>
      <div class="amountbox"><span class="q">Importe</span>
        <input class="amount-in" id="xAmt" inputmode="decimal" autocomplete="off" value="${ex?fmtIn(fx.orig):""}" placeholder="0" aria-label="Importe">
        <select id="xCur" class="cursel" aria-label="Moneda del gasto">${curOpts.map(c=>`<option value="${c}" ${fx.cur===c?"selected":""}>${c} · ${esc(symOf(c))}</option>`).join("")}</select></div>
      <div class="card" id="xFx" ${fx.cur===gc?"hidden":""}>
        <p class="step-t">Tipo de cambio</p>
        <div class="fxrow"><span>1 <b id="xFxFrom">${esc(fx.cur)}</b> =</span><input id="xRate" inputmode="decimal" autocomplete="off" value="${fmtIn(fx.rate)}" aria-label="Tipo de cambio"><span>${esc(gc)}</span></div>
        <p class="hint" id="xFxOut"></p>
      </div>
      <div class="grid2">
        <label>Pagado por<select id="xPaid">${g.members.map(m=>`<option value="${esc(m.id)}" ${!multi.on && st.payer===m.id?"selected":""}>${esc(m.id===ME?"Yo":m.name)}</option>`).join("")}<option value="__multi" ${multi.on?"selected":""}>Varias personas…</option></select></label>
        <label>Fecha<input id="xDate" type="date" value="${esc(ex?ex.date:todayISO())}"></label>
      </div>
      <div class="card" id="xMulti" ${multi.on?"":"hidden"}>
        <p class="step-t">¿Cuánto puso cada uno?</p>
        <div class="fw-list">${g.members.map(m=>`<div class="fw"><span style="width:26px"></span>${avatar(m.id===ME?"Yo":m.name,"sm")}<span class="fw-n">${esc(m.id===ME?"Yo":m.name)}</span><input class="fw-in" inputmode="decimal" data-payin="${esc(m.id)}" value="${esc(multi.vals[m.id]||"")}" placeholder="0,00" aria-label="Lo que puso ${esc(m.name)}"></div>`).join("")}</div>
        <div id="xMultiBal"></div>
      </div>
      ${splitEditorHTML(st, {})}
      <p class="err" id="xErr" hidden></p>
      <button type="button" class="btn wide" id="xSave" ${ex?"":"disabled"}>${ex?"Guardar cambios":"Añadir gasto"}</button>
      ${ex?`<button type="button" class="btn ghost wide" id="xDel" style="color:var(--bad)">Borrar gasto</button>`:""}`, "expense:"+gid, {focus: ex ? null : "#xConcept"});
    const btn = $("#xSave");
    const payersSum = () => r2(Object.values(multi.vals).reduce((a,v)=>a+(parseAmount(v)||0),0));
    const multiValid = () => !multi.on || Math.abs(payersSum() - fx.orig) < 0.005;
    const payerLabel = () => {
      if (!multi.on) return st.payer===ME ? "ti" : (st.members.find(m=>m.id===st.payer)||{}).name;
      const ps = Object.entries(multi.vals).filter(([k,v])=>parseAmount(v)>0).map(([k])=>k===ME?"ti":(st.members.find(m=>m.id===k)||{}).name);
      return ps.length ? ps.join(" y ") : "quien pagó";
    };
    const isPayer = id => multi.on ? parseAmount(multi.vals[id])>0 : id===st.payer;
    const recompute = () => {
      st.amount = fx.cur===gc ? r2(fx.orig) : r2(fx.orig * (fx.rate||0));
      if (fx.cur!==gc) $("#xFxOut").textContent = fx.orig ? `${moneyC(fx.orig, fx.cur)} = ${moneyC(st.amount, gc)}` : "";
      if (multi.on){
        const d = r2(fx.orig - payersSum());
        $("#xMultiBal").innerHTML = !fx.orig ? `<div class="balance-line">Escribe primero el importe.</div>` : Math.abs(d)<0.005 ? `<div class="balance-line ok">Cuadra con el importe.</div>` : d>0 ? `<div class="balance-line">Faltan ${moneyC(d, fx.cur)}.</div>` : `<div class="balance-line bad">Sobran ${moneyC(-d, fx.cur)}.</div>`;
      }
      st.refreshNumbers();
    };
    mountSplitEditor(st, {sub:(id,on)=> !on ? (isPayer(id) ? "pagó, pero no participa" : "no participa") : isPayer(id) ? (id===ME?"pusiste dinero":"puso dinero") : (id===ME ? "debes a " : "debe a ") + esc(payerLabel()),
      onChange:()=>{ btn.disabled = !!st.valid() || !multiValid() || (fx.cur!==gc && !(fx.rate>0)); }});
    $("#xAmt").addEventListener("input", e=>{ fx.orig = parseAmount(e.target.value)||0; recompute(); });
    $("#xCur").addEventListener("change", e=>{ fx.cur = e.target.value; if (fx.cur===gc) fx.rate = 1; $("#xFx").hidden = fx.cur===gc; $("#xFxFrom").textContent = fx.cur; dirty = true; recompute(); });
    $("#xRate").addEventListener("input", e=>{ fx.rate = parseAmount(e.target.value)||0; recompute(); });
    $("#xPaid").addEventListener("change", e=>{ dirty = true; if (e.target.value==="__multi"){ multi.on = true; $("#xMulti").hidden = false; } else { multi.on = false; st.payer = e.target.value; $("#xMulti").hidden = true; } recompute(); });
    $("#xMulti").addEventListener("input", e=>{ const k = e.target.dataset && e.target.dataset.payin; if (k){ multi.vals[k] = e.target.value; recompute(); } });
    $("#xCat").addEventListener("click", e=>{ const b = e.target.closest("[data-cat]"); if (!b) return; cat = cat===b.dataset.cat ? "" : b.dataset.cat; dirty = true; $("#xCat").querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.cat===cat))); });
    recompute();
    btn.addEventListener("click", async ()=>{
      const v = st.valid() || (!multiValid() ? "Lo que puso cada uno tiene que sumar el importe." : "") || (fx.cur!==gc && !(fx.rate>0) ? "Escribe el tipo de cambio." : "");
      if (v){ const err=$("#xErr"); err.textContent=v; err.hidden=false; return; }
      const exp = {id: ex ? ex.id : uid("e"), concept:$("#xConcept").value.trim()||"Gasto", amount:st.amount, paidBy:st.payer, among:[...st.among].filter(id=>st.members.some(m=>m.id===id)), split:st.mode, date:$("#xDate").value||todayISO()};
      if (cat) exp.category = cat;
      if (st.mode==="exact") exp.shares = st.shares();
      if (st.mode==="parts") exp.weights = st.weightsOut();
      if (fx.cur!==gc){ exp.origAmount = fx.orig; exp.origCurrency = fx.cur; exp.rate = fx.rate; }
      if (multi.on){
        const entries = Object.entries(multi.vals).map(([k,v])=>[k, parseAmount(v)||0]).filter(([k,v])=>v>0);
        const tot = Math.round(st.amount*100); let used = 0;
        const conv = entries.map(([k,v])=>{ const c = Math.round(v*(fx.cur===gc?1:fx.rate)*100); used += c; return [k,c]; });
        if (conv.length){ conv.sort((a,b)=>b[1]-a[1]); conv[0][1] += tot-used; }
        exp.payers = Object.fromEntries(conv.map(([k,c])=>[k, c/100]));
        exp.paidBy = conv.length ? conv[0][0] : ME;
      }
      const cur = groups.find(x=>x.id===gid) || g;
      const list = ex ? (cur.expenses||[]).map(x=>x.id===ex.id ? exp : x) : [...(cur.expenses||[]), exp];
      const next = logged(Object.assign({}, cur, {expenses:list}), `${ex?"Editado":"Añadido"} «${exp.concept}» de ${moneyC(exp.amount, gc)}`);
      try { await save("groups", next); } catch(_){ return; }
      toast(ex ? "Gasto guardado" : `Gasto de ${moneyC(st.amount, gc)} añadido`); groupTab = "gastos"; showGroup(gid, true);
    });
    const del = $("#xDel");
    if (del) del.addEventListener("click", async ()=>{
      const cur = groups.find(x=>x.id===gid) || g;
      const next = logged(Object.assign({}, cur, {expenses:(cur.expenses||[]).filter(x=>x.id!==ex.id)}), `Borrado «${ex.concept}» de ${moneyC(ex.amount, gc)}`);
      try { await save("groups", next); } catch(_){ return; }
      toast("Gasto borrado"); groupTab = "gastos"; showGroup(gid, true);
    });
  }

  // --- grupo: detalle ---
  let groupTab = "deben";
  const ARROW = '<svg viewBox="0 0 24 24"><path d="M4 12h15M14 6l6 6-6 6"/></svg>';
  function dayLabel(iso){
    if (!iso) return "Sin fecha";
    const n = daysUntil(iso);
    if (n===0) return "Hoy"; if (n===-1) return "Ayer";
    const [y,m,d] = iso.split("-").map(Number);
    const t = new Date(y,m-1,d).toLocaleDateString(LOC,{weekday:"long", day:"numeric", month:"long"});
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function showGroup(id, back){
    const g = groups.find(x=>x.id===id);
    if (!g){ if (sheetRef==="group:"+id) closeSheet(); return; }
    if (!["gastos","deben","saldos"].includes(groupTab)) groupTab = "deben";
    const c = groupCalc(g);
    const nm = mid => mid===ME ? "Tú" : memberName(g, mid);
    const avName = mid => mid===ME ? "Yo" : memberName(g, mid);
    const mav = (mid, cls) => avatar(avName(mid), cls);
    const mine = r2(c.net[ME]||0);
    const items = (g.expenses||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"") || (b.id||"").localeCompare(a.id||""));
    const exps = items.filter(e=>e.type!=="settle");

    // GASTOS: agrupados por día
    const days = [];
    items.forEach(e=>{ const k = e.date||""; let d = days.find(x=>x.k===k); if (!d){ d = {k, list:[]}; days.push(d); } d.list.push(e); });
    const gc = gcur(g);
    const expRow = e => {
      if (e.type==="settle") return `<div class="settle-row-x"><span class="mv in" aria-hidden="true">✓</span><div style="flex:1;min-width:0"><div style="font-weight:500">Pago</div><div class="hint" style="font-size:12px">${esc(nm(e.from))} → ${esc(nm(e.to))}${e.note?" · "+esc(e.note):""}</div></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-weight:600;color:var(--ok);font-variant-numeric:tabular-nums">${money(e.amount)}</span><button type="button" class="rm" data-rmexp="${esc(e.id)}">Deshacer</button></div></div>`;
      const among = (e.among||[]).filter(x=>g.members.some(m=>m.id===x));
      const cents = Math.round((+e.amount||0)*100), sh = expShares(e, among, cents), P = payersCents(e, cents);
      const pids = Object.keys(P).filter(x=>g.members.some(m=>m.id===x));
      const myPart = among.includes(ME) ? (sh[ME]||0)/100 : 0;
      const who = pids.length>1 ? (pids.length===2 ? pids.map(x=>x===ME?"ti":nm(x)).join(" y ") : plural(pids.length,"persona","personas")) : (nm(pids[0]||e.paidBy)==="Tú" ? "ti" : nm(pids[0]||e.paidBy));
      const involved = [...pids, ...among.filter(x=>!pids.includes(x))];
      const rows = involved.map(x=>{
        const pd = (P[x]||0)/100, part = (sh[x]||0)/100, inc = among.includes(x);
        const bits = [];
        if (pd) bits.push(`${x===ME?"pusiste":"puso"} ${money(pd)}`);
        if (inc) bits.push(`${x===ME?"te toca":"le toca"} ${money(part)}`); else bits.push("no participa");
        return `<div class="br ${pd?"payer":""}"><span class="who">${mav(x,"sm")}<span>${esc(nm(x))}</span></span><span class="val">${bits.join(" · ")}</span></div>`;
      }).join("");
      const how = e.split==="exact" ? "por importes" : e.split==="parts" ? "por partes" : "a partes iguales";
      const ct = e.category ? catOf(e.category) : null;
      const myPaid = (P[ME]||0)/100, delta = r2(myPaid - myPart);
      const impact = delta>0 ? `<small class="pos">te deben ${money(delta)}</small>` : delta<0 ? `<small class="neg">debes ${money(-delta)}</small>` : `<small class="zero">${among.includes(ME)||myPaid?"no te afecta":"no participas"}</small>`;
      return `<details class="exp"><summary>${catIcon(e.category)}<div class="main"><div class="t1">${esc(e.concept||"Gasto")}</div><div class="d">Pagado por ${esc(who)}${e.origCurrency?` · ${moneyC(e.origAmount, e.origCurrency)}`:""}</div></div><div class="side2"><span class="a">${money(e.amount)}</span>${impact}</div></summary>
        <div class="break">${rows}<div class="foot"><span>Dividido ${how} entre ${plural(among.length,"persona","personas")}${e.origCurrency?` · cambio 1 ${esc(e.origCurrency)} = ${String(e.rate).replace(".",",")} ${esc(gc)}`:""}</span><span class="btnrow"><button type="button" class="linkbtn" style="font-size:13px" data-editexp="${esc(e.id)}">Editar</button><button type="button" class="rm" data-rmexp="${esc(e.id)}">Borrar</button></span></div></div></details>`;
    };
    const dayTotal = d => d.list.filter(e=>e.type!=="settle").reduce((a,e)=>a+(+e.amount||0),0);
    const gastosHtml = items.length ? `<div class="pane">${days.map(d=>`<p class="day-h2"><span>${esc(dayLabel(d.k))}</span><span>${dayTotal(d)?money(dayTotal(d)):""}</span></p><div class="exp-card">${d.list.map(expRow).join("")}</div>`).join("")}</div>`
      : `<div class="empty" style="padding:10px 4px"><h3>Sin gastos todavía</h3><p>Pulsa el botón + de abajo para apuntar el primero: qué fue, cuánto costó, quién lo pagó y para quién era.</p></div>`;

    // SALDOS: barras a cada lado de una línea central
    const maxAbs = Math.max(0.01, ...g.members.map(m=>Math.abs(c.net[m.id]||0)));
    const balRows = g.members.slice().sort((a,b)=>(c.net[b.id]||0)-(c.net[a.id]||0)).map(m=>{
      const v = r2(c.net[m.id]||0), pct = (Math.abs(v)/maxAbs*100).toFixed(1), me = m.id===ME;
      const label = `<div class="bn"><b>${esc(nm(m.id))}</b><small>${me?"Pusiste":"Puso"} ${money(c.paid[m.id]||0)}</small><small>${me?"Te toca":"Le toca"} ${money(c.share[m.id]||0)}</small></div>`;
      if (v>0) return `<div class="bal-row"><div class="bL">${label}</div><div class="bR"><div class="bb pos" style="width:${pct}%">+${money(v)}</div></div></div>`;
      if (v<0) return `<div class="bal-row"><div class="bL"><div class="bb neg" style="width:${pct}%">−${money(-v)}</div></div><div class="bR">${label}</div></div>`;
      return `<div class="bal-row"><div class="bL">${label}</div><div class="bR"><div class="bb zero">${money(0)}</div></div></div>`;
    }).join("");
    const toMeN = c.settle.filter(s=>s.to===ME).length, fromMeN = c.settle.filter(s=>s.from===ME).length;
    const transfers = c.settle.length ? c.settle.slice().sort((a,b)=>((a.to===ME?0:a.from===ME?1:2)-(b.to===ME?0:b.from===ME?1:2)) || b.amount-a.amount).map(s=>{
      const txt = s.from===ME ? `Pagas a <b>${esc(nm(s.to))}</b>` : s.to===ME ? `<b>${esc(nm(s.from))}</b> te paga` : `<b>${esc(nm(s.from))}</b> paga a <b>${esc(nm(s.to))}</b>`;
      const acts = s.to===ME
        ? `<button type="button" class="btn small" data-settle="${esc(s.from)}|${esc(s.to)}|${s.amount}">Ya me pagó</button><button type="button" class="btn small soft" data-tomedeben="${esc(s.from)}|${s.amount}">Guardar como deuda</button>`
        : `<button type="button" class="btn small ghost" data-settle="${esc(s.from)}|${esc(s.to)}|${s.amount}">Ya está pagado</button>`;
      const line = '<svg viewBox="0 0 100 14" preserveAspectRatio="none"><path d="M2 7h94M88 2l7 5-7 5"/></svg>';
      return `<div class="tcard ${s.to===ME?"me-in":s.from===ME?"me-out":""}">
        <div class="tc-row"><div class="tc-p">${mav(s.from)}<span>${esc(nm(s.from))}</span></div>
          <div class="tc-mid"><b>${money(s.amount)}</b><span class="ln" aria-hidden="true">${line}</span><small>${s.from===ME?"pagas tú":s.to===ME?"te paga":"paga"}</small></div>
          <div class="tc-p">${mav(s.to)}<span>${esc(nm(s.to))}</span></div></div>
        <div class="acts">${acts}</div></div>`;
    }).join("") : `<div class="card"><p class="hint" style="padding:4px 0">${exps.length ? "Todo cuadra. Nadie le debe nada a nadie." : "Cuando haya gastos, aquí verás quién tiene que pagar a quién."}</p></div>`;
    const payers = g.members.filter(m=>(c.paid[m.id]||0)>0).sort((a,b)=>c.paid[b.id]-c.paid[a.id]);
    const whoPaid = c.total ? `<div class="card">
        <p class="step-t">¿Quién ha puesto el dinero?</p>
        <div class="paybar" role="img" aria-label="${esc(payers.map(m=>nm(m.id)+" "+money(c.paid[m.id])).join(", "))}">${payers.map(m=>`<i style="--h:${hue(avName(m.id))};width:${(c.paid[m.id]/c.total*100).toFixed(2)}%"></i>`).join("")}</div>
        <div class="legend">${payers.map(m=>`<span style="--c:hsl(${hue(avName(m.id))} 55% 52%)">${esc(nm(m.id))} <b>${money(c.paid[m.id])}</b></span>`).join("")}</div>
      </div>` : "";
    const debenHtml = `<div class="pane">
        <div class="vrow" style="padding:0 4px"><p class="step-t">Quién debe a quién</p><span class="pill-m">${g.simplify===false?"Sin simplificar":"Mínimo de pagos"}</span></div>
        <div class="tlist">${transfers}</div>
        ${c.settle.length ? `<div class="owes-sum">${toMeN?`<span class="p">${plural(toMeN,"persona te debe","personas te deben")}</span>`:""}${fromMeN?`<span class="n">Debes a ${plural(fromMeN,"persona","personas")}</span>`:""}${c.settle.length-toMeN-fromMeN?`<span class="z">${plural(c.settle.length-toMeN-fromMeN,"pago","pagos")} entre otros</span>`:""}</div>
        <p class="hint" style="padding:0 4px">${g.simplify===false ? "Simplificar deudas está desactivado: cada uno paga directamente a quien pagó por él. Puedes activarlo en Editar grupo." : "Es el menor número de pagos posible para que todo cuadre."} Cuando alguien pague, márcalo y el grupo se recalcula solo.</p>` : ""}
      </div>`;
    const catRows = Object.entries(c.byCat||{}).sort((a,b)=>b[1]-a[1]);
    const catMax = catRows.length ? catRows[0][1] : 1;
    const catsCard = c.total && catRows.length ? `<div class="card"><p class="step-t">En qué se ha gastado</p><div class="catlist">${catRows.map(([k,v])=>{ const ct = catOf(k); return `<div class="catrow"><span class="cdot" style="--ch:${ct[2]}"></span><span class="cn">${esc(ct[1])}</span><span class="minibar"><i style="width:${(v/catMax*100).toFixed(1)}%;background:hsl(${ct[2]} 55% 52%)"></i></span><span class="cv">${money(v)}<small>${Math.round(v/c.total*100)} %</small></span></div>`; }).join("")}</div></div>` : "";
    const bPct = g.budget ? c.total/g.budget*100 : 0;
    const budgetCard = g.budget ? `<div class="card"><div class="vrow"><span class="step-t">Presupuesto</span><b>${money(c.total)} de ${money(g.budget)}</b></div>
        <div class="bar" style="height:10px"><i style="width:${Math.min(100,bPct).toFixed(1)}%;${bPct>=100?"background:var(--bad)":bPct>=80?"background:var(--warn)":""}"></i></div>
        <p class="hint" style="${bPct>=100?"color:var(--bad)":bPct>=80?"color:var(--warn)":""}">${bPct>=100 ? `Os habéis pasado en ${money(c.total-g.budget)}.` : `Quedan ${money(g.budget-c.total)} (${Math.round(100-bPct)} %).`}</p></div>` : "";
    const saldosHtml = `<div class="pane">${budgetCard}
        <div class="card"><p class="step-t">Saldos</p><div class="bal-chart">${balRows}</div>
          <p class="formula">En verde, quien tiene que cobrar; en rojo, quien tiene que pagar.</p></div>
        ${whoPaid}
        ${catsCard}
        <div class="addperson"><input id="gpNew" autocomplete="off" placeholder="Añadir persona al grupo" aria-label="Nombre"><button type="button" class="btn ghost" data-act="gpadd">Añadir</button></div>
      </div>`;

    const mi = {
      hist:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4M12 8v4l3 2"/></svg>',
      exp:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7 9l5-5 5 5M5 20h14"/></svg>',
      edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg>',
      del:'<svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>'};
    openSheet(head(g.name, {menu:"gmenu", av:`<span class="gc-ic" style="--h:${hue(g.name)};width:34px;height:34px;font-size:13px;border-radius:11px" aria-hidden="true">${esc(initials(g.name))}</span>`}) + `
      <div class="gmenu" id="gMenu" hidden>
        <button type="button" data-act="ghist">${mi.hist}Historial</button>
        <button type="button" data-act="gexport">${mi.exp}Exportar</button>
        <button type="button" data-act="editgroup">${mi.edit}Editar grupo</button>
        <button type="button" data-act="askdelgroup" style="color:var(--bad)">${mi.del}Borrar grupo</button>
      </div>
      <div class="ghero" style="--h:${hue(g.name)}">
        ${avStack(g, 7)}
        <span class="gh-lbl">${mine>0?"Te deben":mine<0?"Debes":"Todo cuadra"}</span>
        <span class="gh-big ${mine>0?"pos":mine<0?"neg":""}">${money(Math.abs(mine))}</span>
        <div class="gh-stats">
          <div><span>Personas</span><b>${g.members.length}</b></div>
          <div><span>Gastos</span><b>${exps.length}</b></div>
          <div><span>Pendientes</span><b>${plural(c.settle.length,"pago","pagos")}</b></div>
        </div>
      </div>
      <div class="seg utabs" role="group" aria-label="Ver">
        <button type="button" data-gtab="deben" aria-pressed="${groupTab==="deben"}">Quién debe${c.settle.length?`<span class="c">${c.settle.length}</span>`:""}</button>
        <button type="button" data-gtab="gastos" aria-pressed="${groupTab==="gastos"}">Gastos<span class="c">${exps.length}</span></button>
        <button type="button" data-gtab="saldos" aria-pressed="${groupTab==="saldos"}">Saldos</button>
      </div>
      <div id="gPane" class="${reduced?"":"enter-bar"}">${groupTab==="gastos"?gastosHtml:groupTab==="deben"?debenHtml:saldosHtml}</div>
      ${g.example?'<p class="hint" style="text-align:center">Este grupo es un ejemplo. Bórralo cuando quieras.</p>':""}
      ${g.archived?'<p class="hint" style="text-align:center">Grupo archivado. Puedes desarchivarlo en Editar grupo.</p>':""}
      <div id="confirmBox"></div>
      <div class="gfoot">
        <div><div class="k">Mis gastos</div><div class="v">${money(c.share[ME]||0)}</div></div>
        <button type="button" class="add" data-act="addexp" aria-label="Añadir gasto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="r"><div class="k">Gastos totales</div><div class="v">${money(c.total)}</div></div>
      </div>`, "group:"+id, {back});
    sheet.querySelectorAll("[data-gtab]").forEach(b=>b.addEventListener("click", ()=>{
      groupTab = b.dataset.gtab; moveSeg(b);
      const p = $("#gPane"); p.innerHTML = groupTab==="gastos"?gastosHtml:groupTab==="deben"?debenHtml:saldosHtml;
      if (!reduced){ p.style.animation="none"; void p.offsetWidth; p.style.animation="rise .35s var(--ease)"; }
    }));
  }

  // --- grupo: historial ---
  function showHistory(gid){
    const g = groups.find(x=>x.id===gid); if (!g) return;
    const when = iso => { const d = new Date(iso); const day = isoOf(d); const n = daysUntil(day);
      const hm = d.toLocaleTimeString(LOC,{hour:"2-digit", minute:"2-digit"});
      return (n===0 ? L("Hoy","Today") : n===-1 ? L("Ayer","Yesterday") : d.toLocaleDateString(LOC,{day:"numeric", month:"short"})) + "<br>" + hm; };
    const list = g.log || [];
    openSheet(head("Historial", {back:"group:"+gid}) + `
      <p class="hint">Todo lo que se ha cambiado en «${esc(g.name)}», lo más reciente primero.</p>
      ${list.length ? `<div class="card" style="padding-block:4px"><ul class="log">${list.map(l=>`<li><span class="when">${when(l.at)}</span><span>${esc(l.text)}</span></li>`).join("")}</ul></div>`
        : `<p class="hint">Aún no hay cambios registrados. A partir de ahora se apuntará cada gasto, pago y ajuste.</p>`}`, "ghist:"+gid);
  }

  // --- grupo: exportar ---
  function groupSummaryText(g){
    const c = groupCalc(g), cur = gcur(g), m = v => moneyC(v, cur);
    const nmS = id => id===ME ? (S.myName || L("Yo","Me")) : memberName(g, id);
    const lines = [`*${clean(g.name)}*`, `${L("Total gastado","Total spent")}: ${m(c.total)}${g.budget?` (${L("presupuesto","budget")} ${m(g.budget)})`:""}`, "", L("Saldos:","Balances:")];
    g.members.forEach(x=>{ const v = r2(c.net[x.id]||0); lines.push(`• ${nmS(x.id)}: ${v>0?"+":v<0?"−":""}${m(Math.abs(v))}  (${L("puso","paid")} ${m(c.paid[x.id]||0)}, ${L("le toca","share")} ${m(c.share[x.id]||0)})`); });
    lines.push("", L("Quién paga a quién:","Who pays whom:"));
    if (c.settle.length) c.settle.forEach(t=>lines.push(`• ${nmS(t.from)} → ${nmS(t.to)}: ${m(t.amount)}`)); else lines.push(L("• Nadie, todo cuadra.","• Nobody, all settled up."));
    lines.push("", L("Hecho con Reparto de Deudas","Made with Reparto de Deudas"));
    return lines.join("\n");
  }
  function groupCSV(g){
    const c = groupCalc(g), cur = gcur(g);
    const num = v => r2(v).toFixed(2).replace(".", ",");
    const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
    const nmS = id => id===ME ? (S.myName || "Yo") : memberName(g, id);

  // Las notas vienen en secciones «### Nuevo / ### Mejoras / ### Correcciones».
  // Las versiones antiguas (sin secciones) se muestran como «Novedades».
  function notesFrom(body){
    const txt = String(body||"").replace(/\r/g,"");
    const m = txt.match(/##\s*Novedades[^\n]*\n([\s\S]*?)(\n---|\n##(?!#)|\n\*\*Instalar|$)/i);
    const sections = []; let cur = null;
    (m ? m[1] : "").split("\n").forEach(l=>{
      const h = l.match(/^###\s*(.+)$/);
      if (h){ cur = {t: h[1].replace(/[^\p{L}\s]/gu,"").trim(), items: []}; sections.push(cur); return; }
      const t = l.replace(/^[\s>*\-•]+/,"").replace(/[`*_]/g,"").trim();
      if (!t || /^(co-authored-by|claude-session|signed-off-by)/i.test(t) || /^\d{1,2} de \p{L}+ de \d{4}$/u.test(t)) return;
      if (!cur){ cur = {t: "Novedades", items: []}; sections.push(cur); }
      cur.items.push(t);
    });
    return sections.filter(x=>x.items.length);
  }
  const secKind = t => /^nuevo/i.test(t) ? "new" : /^correc/i.test(t) ? "fix" : "imp";

  function notesHTML(sections, max){
    let n = 0; const out = [];

    }
    const total = sections.reduce((a,x)=>a+x.items.length,0);
    return out.join("") + (max && total>n ? `<button type="button" class="linkbtn" data-act="allnotes" style="font-size:13px;padding:2px 0">Ver ${total-n} ${total-n===1?"novedad más":"novedades más"}</button>` : "");

  async function apkUpdate(){
    const FS = nativePlugin("Filesystem"), FO = nativePlugin("FileOpener");
    if (!FS || !FO || !upd.url || !/\.apk$/i.test(upd.url)){ location.href = upd.url; return; }
    if (dl.state==="running") return;
    dl.state = "running"; dl.pct = 0; dlRefresh();
    const file = "reparto-de-deudas-" + (upd.build||"nueva") + ".apk";
    let listener = null;
    try {
      listener = await FS.addListener("progress", e=>{ if (e && e.contentLength>0){ dl.pct = Math.min(100, e.bytes/e.contentLength*100); dlRefresh(); } });
      await FS.downloadFile({url: upd.url, path: file, directory: "CACHE", progress: true, recursive: true});
      dl.pct = 100; dl.state = "opening"; dlRefresh();
      const {uri} = await FS.getUri({path: file, directory: "CACHE"});
      await FO.openFile({path: uri, mimeType: "application/vnd.android.package-archive"});
    } catch(e){
      dl.state = "error"; dl.msg = "No se pudo descargar la actualización. Comprueba la conexión e inténtalo otra vez."; dlRefresh();
    } finally { try { listener && listener.remove && listener.remove(); } catch(_){} }
  }

    setTimeout(()=>checkUpdates(false), 1500);
    document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") checkUpdates(false); });
    try { const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App; if (App) App.addListener("resume", ()=>checkUpdates(false)); } catch(e){}
  }
  let pendingImport = null;
  const BKP_EVERY = 14*86400000;
  const bkpGet = k => { try { return +localStorage.getItem(k) || 0; } catch(e){ return 0; } };
  const bkpSet = (k,v) => { try { localStorage.setItem(k, String(v)); } catch(e){} };
  function backupBanner(){
    if (!canFiles || mode!=="local" || !ready) return "";
    const real = debts.filter(d=>!d.example).length + groups.filter(g=>!g.example).length;
    if (real < 2) return "";
    const last = Math.max(bkpGet("rd-bkp-last"), bkpGet("rd-bkp-snooze"));
    if (!last){ if (!bkpGet("rd-bkp-first")) bkpSet("rd-bkp-first", Date.now()); if (Date.now() - bkpGet("rd-bkp-first") < 3*86400000) return ""; }
    else if (Date.now() - last < BKP_EVERY) return "";
    return `<section class="bkp stg" id="bkpBanner" role="status"><div><b>Haz una copia de tus datos</b><span>Están solo en este móvil. Con una copia no los perderás si cambias de teléfono.</span></div>
      <div class="btnrow"><button type="button" class="btn small" data-act="export">Hacer copia ahora</button><button type="button" class="btn ghost small" data-act="bkpsnooze">Más tarde</button></div></section>`;
  }
  async function exportData(){
    bkpSet("rd-bkp-last", Date.now()); const bb = $("#bkpBanner"); if (bb) bb.remove();
    const json = JSON.stringify({app:"reparto-de-deudas", version:1, exportedAt:new Date().toISOString(), debts, groups, settings:S});
    if (window.Capacitor){
      try { await navigator.clipboard.writeText(json); toast("Copia copiada. Pégala en una nota o en WhatsApp para guardarla."); }
      catch(_){
        $("#confirmBox").innerHTML = `<div class="notice"><span>Mantén pulsado el texto para copiarlo y guárdalo donde quieras.</span><textarea readonly rows="5" id="expText"></textarea></div>`;
        $("#expText").value = json; $("#expText").select();
      }
      return;
    }
    const blob = new Blob([json], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "reparto-de-deudas-" + todayISO() + ".json";
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast("Copia descargada");
  }
  function importData(){
    const data = pendingImport; pendingImport = null; if (!data) return;
    debts = data.debts.filter(d=>d && d.id && d.name!=null && d.amount!=null);
    groups = data.groups.filter(g=>g && g.id && Array.isArray(g.members));
    if (data.settings) { S = Object.assign({}, DEFAULTS, data.settings); applySettings(); try{ localStorage.setItem("me-deben-ajustes", JSON.stringify(S)); }catch(e){} }
    lsWrite(); animateNext = true; render(); showSettings(); toast("Copia importada");
  }

  // ---------- ejemplos ----------
  async function loadDebtExamples(){
    const ex = [
      {name:"Carlos (ejemplo)", concept:L("Entradas del concierto","Concert tickets"), amount:85, lentOn:addDays(-40), dueOn:addDays(-5), payments:[], extras:[]},
      {name:"Lucía (ejemplo)", concept:L("Fianza del piso","Flat deposit"), amount:600, lentOn:addDays(-60), dueOn:addDays(30), payments:[{id:uid("p"),amount:200,date:addDays(-30)},{id:uid("p"),amount:150,date:addDays(-2)}], extras:[{id:uid("x"),amount:120,date:addDays(-15),note:L("Gastos de la mudanza","Moving costs")}]},
      {name:"Andrés (ejemplo)", concept:L("Cena de cumpleaños","Birthday dinner"), amount:42.5, lentOn:addDays(-10), dueOn:addDays(4), payments:[], extras:[]},
      {name:"Marta (ejemplo)", concept:L("Gasolina del viaje","Petrol for the trip"), amount:30, lentOn:addDays(-20), dueOn:"", payments:[{id:uid("p"),amount:30,date:addDays(-8)}], extras:[]}
    ];
    for (const e of ex){ try{ await save("debts", Object.assign({id:uid("d"), example:true, createdAt:new Date().toISOString(), phone:"", notes:""}, e), true); }catch(_){ return; } }
    animateNext = true; render(); toast("Ejemplos cargados");
  }
  async function loadGroupExample(){
    const Lu=uid("m"), A=uid("m"), M=uid("m"); const all=[ME,Lu,A,M];
    let g = {id:uid("g"), example:true, name:L("Casa rural (ejemplo)","Cottage weekend (ejemplo)"), createdAt:new Date().toISOString(), currency:S.currency, simplify:true, budget:650,
      members:[{id:ME,name:"Yo"},{id:Lu,name:"Lucía"},{id:A,name:"Andrés"},{id:M,name:"Marta"}],
      expenses:[
        {id:uid("e"), concept:L("Alquiler de la casa","Cottage rental"), category:"alojamiento", amount:320, paidBy:ME, among:all, split:"equal", date:addDays(-6)},
        {id:uid("e"), concept:L("Supermercado","Groceries"), category:"super", amount:86.4, paidBy:Lu, among:all, split:"equal", date:addDays(-5)},
        {id:uid("e"), concept:L("Gasolina","Petrol"), category:"transporte", amount:54, paidBy:A, among:[ME,A,M], split:"equal", date:addDays(-5)},
        {id:uid("e"), concept:L("Cena del sábado","Saturday dinner"), category:"comida", amount:112, paidBy:ME, among:all, split:"exact", shares:{[ME]:30,[Lu]:24,[A]:30,[M]:28}, date:addDays(-4)},
        {id:uid("e"), concept:"Kayak", category:"ocio", amount:80, paidBy:Lu, payers:{[Lu]:50,[M]:30}, among:all, split:"parts", weights:{[ME]:1,[Lu]:1,[A]:1,[M]:1}, date:addDays(-3)}
      ]};
    g = logged(g, "Grupo de ejemplo creado");
    try { await save("groups", g); } catch(_){ return; }
    toast("Grupo de ejemplo cargado"); showGroup(g.id);
  }
  async function clearExamples(){
    const dx = debts.filter(d=>d.example).map(d=>d.id), gx = groups.filter(g=>g.example).map(g=>g.id);
    if (!dx.length && !gx.length){ toast("No hay ejemplos que borrar"); return; }
    for (const id of dx){ try{ await remove("debts", id); }catch(_){ return; } }
    for (const id of gx){ try{ await remove("groups", id); }catch(_){ return; } }
    toast("Ejemplos borrados");
  }

  // ---------- eventos ----------
  document.addEventListener("click", async e=>{
    const t = e.target.closest("button"); if (!t || t.disabled) return;
    if (t.dataset.tab){ if (tab!==t.dataset.tab){ tab = t.dataset.tab; animateNext = true; render(); window.scrollTo({top:0}); } return; }
    if (t.dataset.f){ filter = t.dataset.f; try{localStorage.setItem("me-deben-filter",filter);}catch(_){} moveSeg(t); const l=$("#dlist"); if (l){ l.innerHTML = debtRows(); if(!reduced){ l.style.animation="none"; void l.offsetWidth; l.style.animation="rise .35s var(--ease)"; } } return; }
    if (t.dataset.open){ const r = t.dataset.open; if (r.startsWith("group:") && !t.dataset.back) groupTab = "deben"; if (r==="add") addChooser(); else if (r.startsWith("pick:")) pickDebt(r.slice(5)); else openRef(r, false, !!t.dataset.back); return; }
    if (t.dataset.set==="lang"){ S.lang = t.dataset.val; try { localStorage.setItem("me-deben-ajustes", JSON.stringify(S)); } catch(_){} if (mode==="db" && cols){ try { await cols.debts.doc("ajustes").set(JSON.parse(JSON.stringify(S))); } catch(_){} } location.reload(); return; }
    if (t.dataset.set){ const v = t.dataset.val; const num = ["fs","soonDays","defaultDue"].includes(t.dataset.set); if (t.closest(".seg")) moveSeg(t); setSetting(t.dataset.set, num ? +v : v); if (t.dataset.set==="accent"||t.dataset.set==="theme"||t.dataset.set==="fs"||t.dataset.set==="corners") showSettings(); else sheet.querySelectorAll(`[data-set="${t.dataset.set}"]`).forEach(b=>b.setAttribute("aria-pressed", String(b===t))); return; }
    if (t.dataset.pickgroup){ expenseForm(t.dataset.pickgroup); return; }
    if (t.dataset.pick){ showDebt(t.dataset.pick, t.dataset.purpose==="more" ? "more" : undefined); return; }
    if (t.dataset.mergeinto){
      const m = debts.find(x=>x.id===t.dataset.mergeinto); if (!m) return;
      const amt = parseAmount($("#fAmount").value);
      if (!(amt>0)){ const err=$("#fErr"); err.textContent="Escribe primero el importe que quieres sumar."; err.hidden=false; $("#fAmount").focus(); return; }
      await addExtra(m, amt, $("#fLent").value, $("#fConcept").value.trim(), $("#fDue").value || m.dueOn || "");
      return;
    }
    const cur = sheetRef ? sheetRef.split(":") : [];
    const d = cur[0]==="debt" ? debts.find(x=>x.id===cur[1]) : null;
    const g = cur[0]==="group" ? groups.find(x=>x.id===cur[1]) : null;
    if (t.dataset.rmmv && d){
      const [k,id] = t.dataset.rmmv.split(":");
      const next = Object.assign({}, d);
      if (k==="in") next.payments = (d.payments||[]).filter(p=>p.id!==id); else next.extras = (d.extras||[]).filter(x=>x.id!==id);
      if (restOf(next) > 0) delete next.settledAt;
      try { await save("debts", next); } catch(_){ return; } toast("Movimiento quitado"); showDebt(d.id); return;
    }
    if (t.dataset.editexp && g){ expenseForm(g.id, t.dataset.editexp); return; }
    if (t.dataset.rmexp && g){
      const gone = (g.expenses||[]).find(x=>x.id===t.dataset.rmexp);
      const txt = gone && gone.type==="settle" ? `Deshecho el pago de ${memberName(g,gone.from)==="Yo"?"Tú":memberName(g,gone.from)} a ${memberName(g,gone.to)==="Yo"?"Tú":memberName(g,gone.to)} (${money(gone.amount)})` : `Borrado «${gone?gone.concept:"gasto"}»${gone?" de "+money(gone.amount):""}`;
      try { await save("groups", logged(Object.assign({}, g, {expenses:(g.expenses||[]).filter(x=>x.id!==t.dataset.rmexp)}), txt)); } catch(_){ return; }
      toast("Hecho"); showGroup(g.id); return;
    }
    if (t.dataset.settle && g){
      const [from,to,amt] = t.dataset.settle.split("|");
      const nn = id => id===ME ? "Tú" : memberName(g,id);
      const sid = uid("s");
      try { await save("groups", logged(Object.assign({}, g, {expenses:[...(g.expenses||[]), {id:sid, type:"settle", from, to, amount:+amt, date:todayISO()}]}), `${nn(from)} pagó ${money(+amt)} a ${nn(to)}`)); } catch(_){ return; }
      showGroup(g.id);
      toast(`${nn(from)} → ${nn(to)}: pago guardado`, {label:"Deshacer", fn: async ()=>{
        const cur = groups.find(x=>x.id===g.id); if (!cur) return;
        try { await save("groups", logged(Object.assign({}, cur, {expenses:(cur.expenses||[]).filter(x=>x.id!==sid)}), `Deshecho el pago de ${nn(from)} a ${nn(to)} (${money(+amt)})`)); } catch(_){ return; }
        if (sheetRef==="group:"+g.id) showGroup(g.id); toast("Pago deshecho");
      }});
      return;
    }
    if (t.dataset.tomedeben && g){
      const [from, amt] = t.dataset.tomedeben.split("|"); const a = +amt; const name = memberName(g, from);
      const existing = debts.find(x=>norm(x.name)===norm(name) && statusOf(x).key!=="done");
      try {
        if (existing) await save("debts", Object.assign({}, existing, {extras:[...(existing.extras||[]), {id:uid("x"), amount:a, date:todayISO(), note:"Grupo " + g.name}]}), true);
        else await save("debts", {id:uid("d"), name, amount:a, concept:g.name, lentOn:todayISO(), dueOn: S.defaultDue ? addDays(S.defaultDue) : "", phone:"", notes:"Viene de un reparto en grupo.", payments:[], extras:[], fromGroup:g.id, createdAt:new Date().toISOString(), example: g.example || undefined}, true);
        await save("groups", logged(Object.assign({}, g, {expenses:[...(g.expenses||[]), {id:uid("s"), type:"settle", from, to:ME, amount:a, date:todayISO(), note:"pasado a Me deben"}]}), `${clean(name)}: ${money(a)} pasados a Me deben`));
      } catch(_){ return; }
      toast(`${clean(name)} ahora está en Me deben`); showGroup(g.id); return;
    }
    const act = t.dataset.act; if (!act) return;
    if (act==="close") closeSheet();
    else if (act==="newdebt") { if (ready) debtForm(); }
    else if (act==="moredebt") pickDebt("more");
    else if (act==="paypick") pickDebt("pay");
    else if (act==="quick") { if (ready) quickSplit(); }
    else if (act==="newgroup") { if (ready) groupForm(); }
    else if (act==="exdebts") loadDebtExamples();
    else if (act==="exgroups") loadGroupExample();
    else if (act==="editdebt" && d) debtForm(d);
    else if (act==="editgroup" && g) groupForm(g);
    else if (act==="addexp" && g) expenseForm(g.id);
    else if (act==="ghist" && g) showHistory(g.id);
    else if (act==="gmenu"){ const m = $("#gMenu"); if (m){ m.hidden = !m.hidden; t.setAttribute("aria-expanded", String(!m.hidden)); } }
    else if (act==="pickgroup") pickGroup();
    else if (act==="w-debt"){ tab = "debts"; debtForm(); }
    else if (act==="w-quick"){ quickSplit(); }
    else if (act==="w-group"){ tab = "split"; groupForm(); }
    else if (act==="w-demo"){ await loadDebtExamples(); tab = "split"; await loadGroupExample(); }
    else if (act==="w-skip"){ try { localStorage.setItem("rd-welcome-skip","1"); } catch(_){} animateNext = true; render(); }
    else if (act==="gexport" && g) showExport(g.id);
    else if (act==="gpadd" && g){
      const inp = $("#gpNew"), n = inp.value.trim(); if (!n) return;
      if (g.members.some(m=>norm(m.name)===norm(n))){ toast(n+" ya está en el grupo"); return; }
      try { await save("groups", logged(Object.assign({}, g, {members:[...g.members, {id:uid("m"), name:n}]}), `Añadido al grupo: ${n}`)); } catch(_){ return; }
      toast(n+" añadido al grupo"); showGroup(g.id);
    }
    else if (act==="payall" && d) addPayment(d, restOf(d), todayISO());
    else if (act==="settings") showSettings();
    else if (act==="export") exportData();
    else if (act==="bkpsnooze"){ bkpSet("rd-bkp-snooze", Date.now() - BKP_EVERY + 7*86400000); const bb = $("#bkpBanner"); if (bb) bb.remove(); toast("Te lo recordaremos en una semana"); }
    else if (act==="checkupd") checkUpdates(true);
    else if (act==="applyupd") applyWebUpdate();
    else if (act==="apkupd") apkUpdate();
    else if (act==="allnotes") showAllNotes();
    else if (act==="skipupd"){ try { localStorage.setItem("rd-upd-skip", String(upd.build)); } catch(_){} upd.swReady = false; refreshUpd(); }
    else if (act==="pastecopy"){
      $("#confirmBox").innerHTML = `<div class="notice"><span>Pega aquí el texto de tu copia.</span><textarea rows="5" id="pasteText" placeholder='{"app":"reparto-de-deudas"…'></textarea><button type="button" class="btn small" data-act="checkpaste">Revisar copia</button></div>`;
      $("#pasteText").focus();
    }
    else if (act==="checkpaste"){ try { askImport(JSON.parse($("#pasteText").value)); } catch(_){ toast("Ese texto no es una copia de Reparto de Deudas"); } }
    else if (act==="doimport") importData();
    else if (act==="resettpl"){ setSetting("template", DEFAULT_TPL); showSettings(); }
    else if (act==="clearex"){ await clearExamples(); if (sheetRef==="settings") showSettings(); }
    else if (act==="resetsettings"){
      $("#confirmBox").innerHTML = `<div class="confirm"><span>¿Volver a los ajustes de fábrica? Tus deudas y grupos no se borran.</span>
        <div class="grid2"><button type="button" class="btn danger small" data-act="doreset">Volver a los ajustes iniciales</button><button type="button" class="btn ghost small" data-act="nodel">Cancelar</button></div></div>`;
      $("#confirmBox").scrollIntoView({block:"nearest", behavior: reduced ? "auto" : "smooth"});
    }
    else if (act==="doreset"){ S = Object.assign({}, DEFAULTS); setSetting("theme", "system"); showSettings(); toast("Ajustes restablecidos"); }
    else if (act==="copy" && d){
      const txt = reminderText(d);
      try { await navigator.clipboard.writeText(txt); toast("Mensaje copiado"); }
      catch(_){ const r=document.createRange(); r.selectNodeContents($("#msg")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texto seleccionado: cópialo con el menú del iPhone"); }
    }
    else if ((act==="askdel" && d) || (act==="askdelgroup" && g)){
      const what = d ? `la deuda de <b>${esc(d.name)}</b> con todos sus movimientos` : `el grupo <b>${esc(g.name)}</b> y todos sus gastos`;
      $("#confirmBox").innerHTML = `<div class="confirm"><span>¿Borrar ${what}? No se puede deshacer.</span>
        <div class="grid2"><button type="button" class="btn danger small" data-act="${d?"del":"delgroup"}">Sí, borrar</button><button type="button" class="btn ghost small" data-act="nodel">Cancelar</button></div></div>`;
      $("#confirmBox").scrollIntoView({block:"nearest", behavior: reduced ? "auto" : "smooth"});
    }
    else if (act==="nodel") $("#confirmBox").innerHTML = "";
    else if (act==="del" && d){ const n=d.name; try{ await remove("debts", d.id); }catch(_){ return; } closeSheet(); toast(`Deuda de ${clean(n)} borrada`); }
    else if (act==="delgroup" && g){ const n=g.name; try{ await remove("groups", g.id); }catch(_){ return; } closeSheet(); toast(`Grupo ${clean(n)} borrado`); }
  });
  $("#addBtn").addEventListener("click", ()=>{ if (!ready) return; addChooser(); });
  $("#settingsBtn").addEventListener("click", ()=>showSettings());
  document.addEventListener("input", e=>{ if (e.target.id==="q"){ query = e.target.value; const l=$("#dlist"); if (l) l.innerHTML = debtRows(); } });
  window.addEventListener("resize", ()=>{ placeSegs(document); });
  document.addEventListener("change", e=>{ const t = e.target; if (t && t.dataset && t.dataset.toggle) setSetting(t.dataset.toggle, t.checked); });

  let tt; function toast(m, action){
    const el=$("#toast"); el.textContent = m;
    if (action){ const b = document.createElement("button"); b.type = "button"; b.className = "tact"; b.textContent = action.label || "Deshacer";
      b.addEventListener("click", ev=>{ ev.stopPropagation(); el.classList.remove("show"); action.fn(); }); el.appendChild(b); }
    el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"), action ? 5000 : 2600);
  }

  // Botón «atrás» de Android (solo en la app instalada desde el APK)
  try {
    const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (App) App.addListener("backButton", ()=>{
      if (!shade.hidden && shade.classList.contains("open")){ const b = sheet.querySelector("[data-back]"); if (b) b.click(); else closeSheet(); }
      else if (tab!=="debts"){ tab = "debts"; animateNext = true; render(); }
      else App.exitApp();
    });
  } catch(e){}

  boot();
})();
</script>

<script>
  if ("serviceWorker" in navigator && location.protocol === "https:" && !window.Capacitor) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>
</body>
</html>
