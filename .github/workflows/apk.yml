name: Publicar versión

# Cada cambio en main crea una versión nueva: el APK de Android (en Releases)
# y la web (en GitHub Pages). Las apps instaladas la detectan y avisan.
on:
  push:
    branches: [main]
    # Los cambios solo de documentación no publican una versión nueva.
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  apk:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo para juntar las novedades desde la versión anterior

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Copiar la app web y poner el número de versión
        run: |
          npm run web
          sed -i "s/__APP_BUILD__/${{ github.run_number }}/g" www/index.html www/sw.js

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Permitir que la app instale sus actualizaciones
        run: |
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/res/xml/file_paths.xml || true

      - name: Generar iconos y pantalla de carga
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Sincronizar
        run: npx cap sync android

      - name: Poner número de versión al APK
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Usar siempre la misma firma
        # Así cada APK nuevo se instala encima del anterior sin borrar tus datos.
        run: |
          mkdir -p ~/.android
          cp android-config/debug.keystore ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk reparto-de-deudas.apk

      - name: Guardar el APK en esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: reparto-de-deudas-apk
          path: reparto-de-deudas.apk

      - name: Preparar las novedades
        # Junta los commits desde la versión anterior y los ordena en Nuevo, Mejoras y Correcciones.
        run: |
          git fetch --tags --force --quiet
          python3 .github/scripts/notas.py ${{ github.run_number }} > notas.md
          cat notas.md

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Reparto de Deudas 1.${{ github.run_number }}
          make_latest: true
          files: reparto-de-deudas.apk
          body_path: notas.md

  web:
    name: Web en GitHub Pages
    runs-on: ubuntu-latest
    # Si GitHub Pages no está activado con origen «GitHub Actions», este paso
    # falla sin afectar al APK.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar la web con el número de versión
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js icons .nojekyll www/
          sed -i "s/__APP_BUILD__/${{ github.run_number }}/g" www/index.html www/sw.js

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
